name: Build Windows EXE

on:
  workflow_dispatch:

env:
  VERSION: 1.5.3
  FLUTTER_VERSION: 3.24.5

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0.6"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Generate Bridge
        run: cargo build --package librustdesk --release --target x86_64-pc-windows-msvc
        working-directory: ./libs/hbb_common

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Build RustDesk
        run: cargo build --release --features flutter --target x86_64-pc-windows-msvc

      - name: Upload EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Windows-x64
          path: ./target/x86_64-pc-windows-msvc/release/rustdesk.exe
          if-no-files-found: warn
